server:
  port: ${BOOKING_SERVICE_PORT:8081}

spring:
  application:
    name: bookingservice

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing}?currentSchema=booking
    username: ${BOOKING_DB_USER:booking_svc}
    password: ${BOOKING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    default-schema: booking
    create-schemas: false
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: un payload corrupto no bloquea la partición;
      # el DefaultErrorHandler lo manda directo al DLT sin reintentos.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.*

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Activa OutboxEventWriter/OutboxRelay de shared-infra (requiere tabla outbox_events)
shared:
  outbox:
    enabled: true

# Base URL de eventservice (EventServiceClient le agrega el path del endpoint)
event:
  service:
    url: ${EVENT_SERVICE_URL:http://localhost:8080}

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8091}
  realm: ${KEYCLOAK_REALM:tickets}
  realm.master: master
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
