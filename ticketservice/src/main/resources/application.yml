server:
  port: ${TICKET_SERVICE_PORT:8086}

spring:
  application:
    name: ticketservice

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing}?currentSchema=ticket
    username: ${TICKET_DB_USER:ticket_svc}
    password: ${TICKET_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    default-schema: ticket
    create-schemas: false
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: un payload corrupto no bloquea la partición;
      # el DefaultErrorHandler lo manda directo al DLT sin reintentos.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.*

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Activa OutboxEventWriter/OutboxRelay de shared-infra (requiere tabla outbox_events)
shared:
  outbox:
    enabled: true

qr:
  secret:
    # Clave HMAC-SHA256 en Base64 para firmar los QR (ver QrGenerator)
    key: ${QR_SECRET_KEY}

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
