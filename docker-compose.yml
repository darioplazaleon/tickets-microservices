# `docker compose up -d` levanta solo la infraestructura (para correr los
# servicios desde el IDE). Con `docker compose --profile app up -d --build`
# se levanta el stack completo, servicios incluidos.

# Entorno común de los servicios cuando corren DENTRO de la red de compose:
# los hosts dejan de ser localhost y pasan a ser los nombres de los contenedores.
x-app-env: &app-env
  DB_HOST: postgresql
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-ticketing}
  KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  EVENT_SERVICE_URL: http://eventservice:8080
  BOOKING_SERVICE_URL: http://bookingservice:8081
  ORDER_SERVICE_URL: http://orderservice:8082
  TICKET_SERVICE_URL: http://ticketservice:8086

services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      # Passwords de los roles por servicio, usadas por el init script
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgresql/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ticketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8084:8080"
    depends_on:
      - kafka-broker
    environment:
      - KAFKA_CLUSTERS_NAME=${KAFKA_CLUSTERS_NAME}
      - KAFKA_CLUSTERS_LOCAL_BOOTSTRAP_SERVERS=${KAFKA_CLUSTERS_LOCAL_BOOTSTRAP_SERVERS}
      - DYNAMIC_CONFIG_ENABLED=${DYNAMIC_CONFIG_ENABLED}

  kafka-schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: kafka-schema-registry
    container_name: kafka-schema-registry
    depends_on:
      - kafka-broker
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: ${SCHEMA_REGISTRY_HOST_NAME}
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: ${SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_LISTENERS: ${SCHEMA_REGISTRY_LISTENERS}

  keycloak-db:
    container_name: keycloak-db
    image: postgres:16-alpine
    volumes:
      - ./volume-data/postgres_keycloak_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME}

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    command: ["start-dev", "--import-realm"]
    environment:
      DB_VENDOR: ${DB_VENDOR}
      DB_ADDR: ${DB_ADDR}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8091:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import
    depends_on:
      - keycloak-db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ── Servicios de la aplicación (profile "app") ─────────────────────────────

  eventservice:
    profiles: [app]
    build:
      context: .
      args: { MODULE: eventservice }
    container_name: eventservice
    environment:
      <<: *app-env
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
    ports:
      - "${EVENT_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgresql: { condition: service_healthy }
      kafka-broker: { condition: service_healthy }
      redis: { condition: service_started }

  bookingservice:
    profiles: [app]
    build:
      context: .
      args: { MODULE: bookingservice }
    container_name: bookingservice
    environment:
      <<: *app-env
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-tickets}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    ports:
      - "${BOOKING_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgresql: { condition: service_healthy }
      kafka-broker: { condition: service_healthy }
      redis: { condition: service_started }
      keycloak: { condition: service_started }
      eventservice: { condition: service_started }

  orderservice:
    profiles: [app]
    build:
      context: .
      args: { MODULE: orderservice }
    container_name: orderservice
    environment:
      <<: *app-env
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgresql: { condition: service_healthy }
      kafka-broker: { condition: service_healthy }
      redis: { condition: service_started }

  paymentservice:
    profiles: [app]
    build:
      context: .
      args: { MODULE: paymentservice }
    container_name: paymentservice
    environment:
      <<: *app-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8087}:8087"
    depends_on:
      kafka-broker: { condition: service_healthy }

  ticketservice:
    profiles: [app]
    build:
      context: .
      args: { MODULE: ticketservice }
    container_name: ticketservice
    environment:
      <<: *app-env
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD}
      QR_SECRET_KEY: ${QR_SECRET_KEY}
    ports:
      - "${TICKET_SERVICE_PORT:-8086}:8086"
    depends_on:
      postgresql: { condition: service_healthy }
      kafka-broker: { condition: service_healthy }
      redis: { condition: service_started }

  notificationservice:
    profiles: [app]
    build:
      context: .
      args: { MODULE: notificationservice }
    container_name: notificationservice
    environment:
      <<: *app-env
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    depends_on:
      kafka-broker: { condition: service_healthy }
      redis: { condition: service_started }

  apigateway:
    profiles: [app]
    build:
      context: .
      args: { MODULE: apigateway }
    container_name: apigateway
    environment:
      <<: *app-env
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-tickets}/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-tickets-api}
      JWT_PRINCIPAL_ATTRIBUTE: ${JWT_PRINCIPAL_ATTRIBUTE:-preferred_username}
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    depends_on:
      keycloak: { condition: service_started }
      eventservice: { condition: service_started }
      bookingservice: { condition: service_started }
      ticketservice: { condition: service_started }

volumes:
  db-data:

networks:
  monitoring: